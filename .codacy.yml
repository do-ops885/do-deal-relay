---
# Codacy configuration file
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/
#
# Excludes skill scaffolding templates (code copied into user projects) and
# other generated/auxiliary paths from analysis.

exclude_paths:
  - ".agents/skills/**/templates/**"
  - ".agents/skills/**/references/templates/**"
  - "coverage/**"
  - "node_modules/**"
  - "dist/**"
  - ".wrangler/**"
  # D1 migrations use SQLite syntax; Codacy's SQL analyzer assumes SQL Server.
  - "migrations/**"
  -  # Scratch / staging artifacts directory (commit messages, gh query dumps,
  # fixture files; may contain malformed middle-of-edit docs).
  - ".audit/**"
