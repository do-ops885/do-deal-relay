<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="do-deal-relay dashboard for managing deals, referrals, analytics, and system health"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#0ea5e9"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b1220"
      media="(prefers-color-scheme: dark)"
    />
    <title>do-deal-relay Dashboard</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Deal Relay" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230ea5e9'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='18' font-weight='700' text-anchor='middle' fill='%23fff'%3ED%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to main content</a>

    <div class="app" id="app" data-theme-loading="true">
      <header class="app-header" role="banner">
        <button
          type="button"
          class="sidebar-toggle"
          id="sidebarToggle"
          aria-label="Toggle navigation"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M3 6h18M3 12h18M3 18h18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              fill="none"
            />
          </svg>
        </button>

        <a class="app-brand" href="#/deals" aria-label="do-deal-relay home">
          <span class="app-brand-mark" aria-hidden="true">D</span>
          <span class="app-brand-text">do-deal-relay</span>
        </a>

        <div class="app-header-actions">
          <div
            class="status-indicator"
            id="statusIndicator"
            role="status"
            aria-live="polite"
            aria-atomic="true"
            data-status="unknown"
          >
            <span class="status-dot" aria-hidden="true"></span>
            <span class="status-label" id="statusLabel">Checking</span>
          </div>
          <button
            type="button"
            class="theme-toggle"
            id="themeToggle"
            aria-label="Toggle color theme"
            title="Toggle color theme"
          >
            <svg
              class="icon-sun"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="4" fill="currentColor" />
              <path
                d="M12 2v3M12 19v3M2 12h3M19 12h3M4.5 4.5l2 2M17.5 17.5l2 2M4.5 19.5l2-2M17.5 6.5l2-2"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <svg
              class="icon-moon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"
                fill="currentColor"
              />
            </svg>
          </button>
        </div>
      </header>

      <aside class="app-sidebar" id="sidebar" aria-label="Primary navigation">
        <nav class="sidebar-nav" role="navigation">
          <ul class="nav-list">
            <li>
              <a class="nav-link" href="#/deals" data-route="deals">
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M3 7h18v12H3z M3 7l9-4 9 4"
                    stroke="currentColor"
                    stroke-width="2"
                    fill="none"
                    stroke-linejoin="round"
                  />
                </svg>
                <span>Deals</span>
              </a>
            </li>
            <li>
              <a class="nav-link" href="#/referrals" data-route="referrals">
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M10 13a5 5 0 1 1 0-10 5 5 0 0 1 0 10zM10 13v4a4 4 0 0 0 4 4h4 M14 17h6"
                    stroke="currentColor"
                    stroke-width="2"
                    fill="none"
                    stroke-linecap="round"
                  />
                </svg>
                <span>Referrals</span>
              </a>
            </li>
            <li>
              <a class="nav-link" href="#/analytics" data-route="analytics">
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M4 20V8M10 20V4M16 20v-8M22 20H2"
                    stroke="currentColor"
                    stroke-width="2"
                    fill="none"
                    stroke-linecap="round"
                  />
                </svg>
                <span>Analytics</span>
              </a>
            </li>
            <li>
              <a class="nav-link" href="#/research" data-route="research">
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  aria-hidden="true"
                  focusable="false"
                >
                  <circle
                    cx="11"
                    cy="11"
                    r="7"
                    stroke="currentColor"
                    stroke-width="2"
                    fill="none"
                  />
                  <path
                    d="m20 20-3.5-3.5"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                </svg>
                <span>Research</span>
              </a>
            </li>
            <li>
              <a class="nav-link" href="#/health" data-route="health">
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M12 21s-7-4.5-7-11a7 7 0 0 1 14 0c0 6.5-7 11-7 11z"
                    stroke="currentColor"
                    stroke-width="2"
                    fill="none"
                    stroke-linejoin="round"
                  />
                  <circle cx="12" cy="10" r="2.5" fill="currentColor" />
                </svg>
                <span>System Health</span>
              </a>
            </li>
          </ul>
        </nav>

        <div class="sidebar-footer">
          <span class="sidebar-version" id="appVersion">v0.1.0</span>
        </div>
      </aside>

      <div
        class="sidebar-backdrop"
        id="sidebarBackdrop"
        aria-hidden="true"
      ></div>

      <main class="app-main" role="main">
        <div
          class="app-view"
          id="view"
          tabindex="-1"
          aria-live="polite"
          aria-busy="false"
        >
          <div class="loading-overlay" id="loadingOverlay" hidden>
            <div class="spinner" role="status" aria-label="Loading">
              <span class="visually-hidden">Loading</span>
            </div>
          </div>

          <div class="error-boundary" id="errorBoundary" hidden role="alert">
            <h2 class="error-title">Something went wrong</h2>
            <p class="error-message" id="errorMessage">
              An unexpected error occurred.
            </p>
            <div class="error-actions">
              <button type="button" class="btn btn-primary" id="errorRetry">
                Try Again
              </button>
              <button type="button" class="btn btn-secondary" id="errorDismiss">
                Dismiss
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js", { scope: "/" });
        });
      }
    </script>
  </body>
</html>
