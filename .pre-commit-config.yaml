# Pre-commit configuration for do-deal-relay
# TypeScript/Node.js Cloudflare Workers project
#
# 2026 Best Practice: Only fast checks (lint, format, typecheck).
# Full tests run on push via CI.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0
    hooks:
      - id: prettier
        files: \.(js|ts|json|yaml|yml|md)$
        additional_dependencies:
          - prettier@3.2.5

  - repo: local
    hooks:
      - id: tsc
        name: TypeScript type check
        entry: npx tsc --noEmit
        language: system
        pass_filenames: false
        always_run: true
        files: \.(ts|tsx)$
