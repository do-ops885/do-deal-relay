---
name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Stage 1: Fast quality gates (run in parallel)
  lint:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run typecheck

  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run fmt:check

  docs:
    name: Docs Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run build
      - name: Validate markdown
        run: |
          npx markdownlint-cli --config markdownlint.toml \
            "docs/**/*.md" "README.md" "AGENTS.md" \
            "CONTRIBUTING.md" "SECURITY.md" || true

  validate-codes:
    name: Validation Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run validate

  # Stage 2: Tests (run after lint passes)
  test:
    name: Unit Tests
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: ./scripts/run-tests-ci.sh
        env:
          NODE_ENV: test
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  test-e2e:
    name: E2E Tests
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare Local Environment
        run: |
          # Generate a stable test key for this job
          KEY="ddr_ci_test_key_$(date +%s)"
          echo "TEST_API_KEY=$KEY" >> "$GITHUB_ENV"

          # Hash the test key (SHA-256)
          HASH=$(echo -n "$KEY" | openssl dgst -sha256 | sed 's/.*= //')

          # Seed KV with API Key and mock snapshot
          npx wrangler kv key put --binding DEALS_SOURCES --local "apikey:$HASH" \
            '{
              "userId":"ci-user","role":"admin",
              "createdAt":"2026-01-01T00:00:00Z",
              "rateLimit":{"requestsPerMinute":60,"requestsPerHour":1000}
            }'

          npx wrangler kv key put --binding DEALS_PROD --local "snapshot:prod" \
            '{"stats":{"active":1,"expired":0,"validated":1},"generated_at":"2026-01-01T00:00:00Z","deals":[]}'

          npx wrangler kv key put --binding DEALS_PROD --local "meta:last_run" \
            '{"run_id":"ci-run","timestamp":"2026-01-01T00:00:00Z","duration_ms":100,"deals_count":1}'

      - name: Start dev server
        run: |
          # Pass required secrets for startup validation
          export WEBHOOK_SECRET="whsec_ci_test_secret"
          export API_ENCRYPTION_KEY="ci_test_encryption_key_32_chars_long"
          export EMAIL_WEBHOOK_SECRET="ci_email_webhook_test_secret"
          echo "WEBHOOK_SECRET=whsec_ci_test_secret" > .dev.vars
          echo "API_ENCRYPTION_KEY=ci_test_encryption_key_32_chars_long" >> .dev.vars
          echo "EMAIL_WEBHOOK_SECRET=ci_email_webhook_test_secret" >> .dev.vars
          npx wrangler dev --port 8787 \
            --var WEBHOOK_SECRET:whsec_ci_test_secret \
            --var API_ENCRYPTION_KEY:ci_test_encryption_key_32_chars_long \
            --var EMAIL_WEBHOOK_SECRET:ci_email_webhook_test_secret > wrangler.log 2>&1 &
          WRANGLER_PID=$!
          echo "WRANGLER_PID=$WRANGLER_PID" >> "$GITHUB_ENV"

          # Wait for health check to pass
          for _i in {1..30}; do
            if curl -s http://localhost:8787/health | grep -q '"status":\s*"healthy"'; then
              SUCCESS=1; break
            fi
            sleep 2
          done

          if [ "${SUCCESS:-0}" != "1" ]; then
            echo "Timeout waiting for healthy dev server"
            cat wrangler.log
            kill "$WRANGLER_PID"
            exit 1
          fi

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          SKIP_DEV_SERVER: 1

      - name: Stop dev server
        if: always()
        run: |
          if [ -n "$WRANGLER_PID" ]; then
            kill "$WRANGLER_PID" 2>/dev/null || true
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-results
          path: playwright-report/
          retention-days: 7

  smoke-test:
    name: Smoke Tests
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - name: Run wrangler deploy dry-run
        run: npx wrangler deploy --dry-run
      - name: Run smoke tests
        run: |
          # Pass required secrets for startup validation
          export WEBHOOK_SECRET="whsec_ci_test_secret"
          export API_ENCRYPTION_KEY="ci_test_encryption_key_32_chars_long"
          export EMAIL_WEBHOOK_SECRET="ci_email_webhook_test_secret"
          echo "WEBHOOK_SECRET=whsec_ci_test_secret" > .dev.vars
          echo "API_ENCRYPTION_KEY=ci_test_encryption_key_32_chars_long" >> .dev.vars
          echo "EMAIL_WEBHOOK_SECRET=ci_email_webhook_test_secret" >> .dev.vars
          npx wrangler dev --port 8787 \
            --var WEBHOOK_SECRET:whsec_ci_test_secret \
            --var API_ENCRYPTION_KEY:ci_test_encryption_key_32_chars_long \
            --var EMAIL_WEBHOOK_SECRET:ci_email_webhook_test_secret &
          WRANGLER_PID=$!
          for _i in {1..30}; do
            if curl -s http://localhost:8787/health/live > /dev/null; then
              SUCCESS=1; break
            fi
            sleep 2
          done
          [ "${SUCCESS:-0}" = "1" ] || { echo "Timeout"; kill "$WRANGLER_PID"; exit 1; }
          npm run test:smoke
          kill "$WRANGLER_PID"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Install Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: latest
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: npm audit
        run: |
          npm ci
          npm audit --audit-level=moderate

  # Stage 3: Build verification
  build:
    name: Build
    needs: [lint, format, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-output
          path: dist/
          retention-days: 7

  # Stage 4: Summary
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        format,
        docs,
        validate-codes,
        test,
        test-e2e,
        smoke-test,
        security-scan,
        build,
      ]
    if: always()
    steps:
      - name: Report Status
        run: |
          {
            echo "## CI Results"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Type Check | ${{ needs.lint.result }} |"
            echo "| Format Check | ${{ needs.format.result }} |"
            echo "| Docs Validation | ${{ needs.docs.result }} |"
            echo "| Validation Gates | ${{ needs.validate-codes.result }} |"
            echo "| Unit Tests | ${{ needs.test.result }} |"
            echo "| E2E Tests | ${{ needs.test-e2e.result }} |"
            echo "| Smoke Tests | ${{ needs.smoke-test.result }} |"
            echo "| Security Scan | ${{ needs.security-scan.result }} |"
            echo "| Build | ${{ needs.build.result }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.format.result }}" \
            "${{ needs.validate-codes.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.test-e2e.result }}" \
            "${{ needs.smoke-test.result }}" \
            "${{ needs.security-scan.result }}" \
            "${{ needs.build.result }}"; \
          do
            if [ "$result" = "failure" ]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo "CI Failed - Check individual jobs for details" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "All CI checks passed!" >> "$GITHUB_STEP_SUMMARY"
          fi
