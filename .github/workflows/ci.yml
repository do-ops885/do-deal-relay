---
name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Stage 1: Fast quality gates (run in parallel)
  lint:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run typecheck

  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run fmt:check

  docs:
    name: Docs Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run build
      - name: Validate markdown
        run: |
          npx markdownlint-cli --config markdownlint.toml \
            "docs/**/*.md" "README.md" "AGENTS.md" \
            "CONTRIBUTING.md" "SECURITY.md" || true

  validate-codes:
    name: Validation Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run validate

  # Stage 2: Tests (run after lint passes)
  test:
    name: Unit Tests
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: ./scripts/run-tests-ci.sh
        env:
          NODE_ENV: test
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  test-e2e:
    name: E2E Tests
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start dev server
        run: |
          npx wrangler dev --port 8787 &
          WRANGLER_PID=$!
          for _i in {1..30}; do
            if curl -s http://localhost:8787/health/live > /dev/null 2>&1; then
              SUCCESS=1; break
            fi
            sleep 2
          done
          [ "${SUCCESS:-0}" = "1" ] || { echo "Timeout waiting for dev server"; kill "$WRANGLER_PID"; exit 1; }
          echo "WRANGLER_PID=$WRANGLER_PID" >> $GITHUB_ENV
      - name: Run E2E tests
        run: npm run test:e2e
        continue-on-error: true
      - name: Stop dev server
        if: always()
        run: kill "$WRANGLER_PID" 2>/dev/null || true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-results
          path: playwright-report/
          retention-days: 7

  smoke-test:
    name: Smoke Tests
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - name: Run wrangler deploy dry-run
        run: npx wrangler deploy --dry-run
      - name: Run smoke tests
        run: |
          npx wrangler dev --port 8787 &
          WRANGLER_PID=$!
          for _i in {1..30}; do
            if curl -s http://localhost:8787/health/live > /dev/null; then
              SUCCESS=1; break
            fi
            sleep 2
          done
          [ "${SUCCESS:-0}" = "1" ] || { echo "Timeout"; kill "$WRANGLER_PID"; exit 1; }
          npm run test:smoke
          kill "$WRANGLER_PID"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Install Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 #   # v0.36.0
        with:
          version: latest
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: npm audit
        run: |
          npm ci
          npm audit --audit-level=moderate

  # Stage 3: Build verification
  build:
    name: Build
    needs: [lint, format, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-output
          path: dist/
          retention-days: 7

  # Stage 4: Summary
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        format,
        docs,
        validate-codes,
        test,
        test-e2e,
        smoke-test,
        security-scan,
        build,
      ]
    if: always()
    steps:
      - name: Report Status
        run: |
          {
            echo "## CI Results"
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Type Check | ${{ needs.lint.result }} |"
            echo "| Format Check | ${{ needs.format.result }} |"
            echo "| Docs Validation | ${{ needs.docs.result }} |"
            echo "| Validation Gates | ${{ needs.validate-codes.result }} |"
            echo "| Unit Tests | ${{ needs.test.result }} |"
            echo "| E2E Tests | ${{ needs.test-e2e.result }} |"
            echo "| Smoke Tests | ${{ needs.smoke-test.result }} |"
            echo "| Security Scan | ${{ needs.security-scan.result }} |"
            echo "| Build | ${{ needs.build.result }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.format.result }}" \
            "${{ needs.validate-codes.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.test-e2e.result }}" \
            "${{ needs.smoke-test.result }}" \
            "${{ needs.security-scan.result }}" \
            "${{ needs.build.result }}"; \
          do
            if [ "$result" = "failure" ]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo "CI Failed - Check individual jobs for details" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "All CI checks passed!" >> "$GITHUB_STEP_SUMMARY"
          fi
