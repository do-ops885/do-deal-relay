---
name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # Stage 1: Fast quality gates (run in parallel)
  lint:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck

  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run fmt:check

  docs:
    name: Docs Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Validate markdown
        run: |
          npx markdownlint-cli --config markdownlint.toml \
            "docs/**/*.md" "README.md" "AGENTS.md" \
            "CONTRIBUTING.md" "SECURITY.md" || true

  validate-codes:
    name: Validation Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run validate

  # Stage 2: Tests (run after lint passes)
  test:
    name: Unit Tests
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: ./scripts/run-tests-ci.sh
        env:
          NODE_ENV: test
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  test-e2e:
    name: E2E Tests
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Start dev server
        run: |
          npx wrangler dev --port 8787 &
          WRANGLER_PID=$!
          for i in {1..30}; do
            if curl -s http://localhost:8787/health/live > /dev/null 2>&1; then
              SUCCESS=1; break
            fi
            sleep 2
          done
          [ "${SUCCESS:-0}" = "1" ] || { echo "Timeout waiting for dev server"; kill $WRANGLER_PID; exit 1; }
          echo "WRANGLER_PID=$WRANGLER_PID" >> $GITHUB_ENV
      - name: Run E2E tests
        run: npm run test:e2e
        continue-on-error: true
      - name: Stop dev server
        if: always()
        run: kill $WRANGLER_PID 2>/dev/null || true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: playwright-report/
          retention-days: 7

  smoke-test:
    name: Smoke Tests
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Run wrangler deploy dry-run
        run: npx wrangler deploy --dry-run
      - name: Run smoke tests
        run: |
          npx wrangler dev --port 8787 &
          WRANGLER_PID=$!
          for i in {1..30}; do
            if curl -s http://localhost:8787/health/live > /dev/null; then
              SUCCESS=1; break
            fi
            sleep 2
          done
          [ "${SUCCESS:-0}" = "1" ] || { echo "Timeout"; kill $WRANGLER_PID; exit 1; }
          npm run test:smoke
          kill $WRANGLER_PID

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: npm audit
        run: |
          npm ci --legacy-peer-deps
          npm audit --audit-level=moderate

  # Stage 3: Build verification
  build:
    name: Build
    needs: [lint, format, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  # Stage 4: Summary
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        format,
        docs,
        validate-codes,
        test,
        test-e2e,
        smoke-test,
        security-scan,
        build,
      ]
    if: always()
    steps:
      - name: Report Status
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          for job in lint format docs validate-codes test test-e2e smoke-test security-scan build; do
            result="${{ needs[job].result }}"
            echo "| ${job} | ${result} |" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED=0
          for job in lint format validate-codes test test-e2e smoke-test security-scan build; do
            result="${{ needs[job].result }}"
            if [ "${result}" = "failure" ]; then
              FAILED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo "CI Failed - Check individual jobs for details" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "All CI checks passed!" >> $GITHUB_STEP_SUMMARY
          fi
