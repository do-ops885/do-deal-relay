---
name: Scheduled Discovery

"on":
  schedule:
    # Run every 6 hours (matching the cron in wrangler.jsonc)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run discovery on"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

concurrency:
  group: scheduled-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discovery-production:
    name: Discovery - Production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.schedule != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1

      - name: Resolve production host
        id: resolve_host
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_HOST: ${{ vars.WORKER_HOST }}
        run: |
          if [ -z "${WORKER_HOST}" ]; then
            echo "⚠️  WORKER_HOST is not set on the 'production' GitHub Environment."
            echo "    Skipping scheduled discovery. Set WORKER_HOST to enable."
            echo "host=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "scripts/worker-host.sh" ]; then
            echo "❌ scripts/worker-host.sh not found in checkout"
            echo "host=" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          HOST="$(bash scripts/worker-host.sh production)"
          echo "Resolved production host: ${HOST}"
          echo "host=${HOST}" >> "$GITHUB_OUTPUT"

      - name: Trigger discovery pipeline
        if: steps.resolve_host.outputs.host != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROD_URL="https://${{ steps.resolve_host.outputs.host }}"
          echo "Production URL: ${PROD_URL}"

          # Health check first
          echo "Checking production health..."
          if ! curl -sf "${PROD_URL}/health"; then
            echo "⚠️ Production health check failed, but continuing with discovery"
          fi

          # Trigger discovery
          echo "Triggering discovery..."
          RESPONSE=$(curl -sf -X POST "${PROD_URL}/api/discover" 2>&1) || {
            echo "Discovery trigger failed: ${RESPONSE}"
            exit 1
          }
          echo "Discovery triggered successfully: ${RESPONSE}"

      - name: Wait and verify
        if: steps.resolve_host.outputs.host != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROD_URL="https://${{ steps.resolve_host.outputs.host }}"
          echo "Waiting 2 minutes for discovery to complete..."
          sleep 120

          # Check status
          echo "Checking discovery status..."
          STATUS=$(curl -sf "${PROD_URL}/api/status" 2>/dev/null || echo '{}')
          echo "Status: ${STATUS}"

      - name: Report to logs
        if: always()
        run: |
          echo "Scheduled discovery run completed at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo "Run ID: ${{ github.run_id }}"

  discovery-staging:
    name: Discovery - Staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    if: github.event.inputs.environment == 'staging'

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1

      - name: Trigger discovery on staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_HOST: ${{ vars.WORKER_HOST }}
        run: |
          if [ -z "${WORKER_HOST}" ]; then
            echo "⚠️  WORKER_HOST is not set on the 'staging' GitHub Environment."
            echo "    Skipping scheduled discovery. Set WORKER_HOST to enable."
            exit 0
          fi

          if [ ! -f "scripts/worker-host.sh" ]; then
            echo "❌ scripts/worker-host.sh not found in checkout"
            exit 1
          fi

          echo "Triggering discovery on staging..."

          STAGING_HOST="$(bash scripts/worker-host.sh staging)"
          if [ -z "${STAGING_HOST}" ]; then
            echo "❌ Could not resolve staging host"
            echo "   Set WORKER_HOST on the GitHub Environment for this job:" >&2
            echo "     Settings → Environments → production → Variables → WORKER_HOST" >&2
            echo "     Settings → Environments → staging    → Variables → WORKER_HOST" >&2
            exit 1
          fi

          STAGING_URL="https://${STAGING_HOST}"

          # Health check
          echo "Checking staging health..."
          curl -sf "${STAGING_URL}/health" || echo "⚠️ Staging health check warning"

          # Trigger discovery
          echo "Triggering discovery..."
          curl -sf -X POST "${STAGING_URL}/api/discover" || {
            echo "❌ Discovery trigger failed"
            exit 1
          }

          echo "✅ Discovery triggered on staging"

      - name: Report to logs
        if: always()
        run: |
          echo "Staging discovery run completed at $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
