---
name: Security & Compliance

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      outcome: ${{ steps.secret-scan.conclusion }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Run TruffleHog secret scanner
        run: |
          # Install TruffleHog
          INSTALL_URL="https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh"
          curl -sSfL "${INSTALL_URL}" | sh -s -- -b /usr/local/bin

          # Handle single-commit scenario where BASE and HEAD are the same
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          if [ "${BEFORE}" = "${SHA}" ] || [ -z "${BEFORE}" ]; then
            echo "Single commit push - running full filesystem scan"
            trufflehog filesystem . --only-verified --json || true
          else
            echo "Running incremental scan from ${BEFORE} to ${SHA}"
            trufflehog git . --since-commit "${BEFORE}" \
              --only-verified --json || true
          fi
        continue-on-error: true
        id: secret-scan

  dependency-check:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        continue-on-error: true
        run: |
          npm audit --omit=dev --audit-level=high || echo "⚠️ npm audit advisories logged (non-blocking)"

      - name: Check for outdated dependencies
        run: |
          echo "Checking for outdated dependencies..."
          npm outdated || true

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-check]
    if: always()

    steps:
      - name: Report Status
        run: |
          SECRET_SCAN_RESULT="${{ needs.secret-scan.result }}"
          DEPENDENCY_CHECK_RESULT="${{ needs.dependency-check.result }}"
          {
            echo "## Security Scan Results"
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Secret Scan | ${SECRET_SCAN_RESULT} |"
            echo "| Dependency Audit | ${DEPENDENCY_CHECK_RESULT} |"
          } >> "$GITHUB_STEP_SUMMARY"

          SECRET_SCAN_OUTCOME="${{ needs.secret-scan.outputs.outcome }}"
          if [[ "${SECRET_SCAN_RESULT}" == "failure" ]] || [[ "${SECRET_SCAN_OUTCOME}" == "failure" ]]; then
            {
              echo ""
              echo "❌ **SECRETS DETECTED** - Immediate action required"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo ""
            echo "✅ Security checks completed"
          } >> "$GITHUB_STEP_SUMMARY"
