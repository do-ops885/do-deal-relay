name: CI + Labels Setup

"on":
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  issues: write

jobs:
  labels:
    name: Initialize GitHub Labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Ensure script is executable
        run: chmod +x scripts/gh-labels-creator.sh

      - name: Run label initialization
        run: ./scripts/gh-labels-creator.sh --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-skills:
    name: Validate Skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup skills
        run: ./scripts/setup-skills.sh

      - name: Validate skills
        run: ./scripts/validate-skills.sh

      - name: Check evals freshness
        run: bash scripts/check-evals-freshness.sh
