---
name: Deploy - Staging

"on":
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15

    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: ./scripts/run-tests-ci.sh

      - name: Deploy to Cloudflare Staging
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify staging deployment
        run: |
          echo "Waiting for deployment to propagate..."
          sleep 15

          # Health check
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          HEALTH_URL="https://do-deal-relay-staging.${ACCOUNT_ID}.workers.dev/health"
          echo "Checking health at: ${HEALTH_URL}"

          for i in {1..5}; do
            if curl -sf "${HEALTH_URL}"; then
              echo "✅ Staging health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done

          echo "❌ Staging health check failed after 5 attempts"
          exit 1

      - name: Run smoke tests on staging
        run: |
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          STAGING_URL="https://do-deal-relay-staging.${ACCOUNT_ID}.workers.dev"

          echo "Running smoke tests on staging..."

          # Test health endpoint
          curl -sf "${STAGING_URL}/health" || exit 1
          echo "✅ Health endpoint OK"

          # Test metrics endpoint
          curl -sf "${STAGING_URL}/metrics" || exit 1
          echo "✅ Metrics endpoint OK"

          # Test deals endpoint
          curl -sf "${STAGING_URL}/deals" || exit 1
          echo "✅ Deals endpoint OK"

          # Test API status endpoint
          curl -sf "${STAGING_URL}/api/status" || exit 1
          echo "✅ API status endpoint OK"

          echo "All smoke tests passed!"

      - name: Notify on success
        if: success()
        run: |
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          echo "Staging deployment completed successfully"
          echo "URL: https://do-deal-relay-staging.${ACCOUNT_ID}.workers.dev"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const sha = context.sha;
            const runId = context.runId;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const title = 'Staging deployment failed';

            // Check for existing open staging issue
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deployment,staging,failed'
            });

            const duplicateExists = existingIssues.data.some(issue =>
              issue.title === title && issue.body.includes(sha.substring(0, 7))
            );

            if (duplicateExists) {
              console.log(`Staging issue already exists for ${sha.substring(0, 7)}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `Staging deployment failed for commit ${sha}.\n\n` +
                `[View workflow run](${url}/actions/runs/${runId})`,
              labels: ['deployment', 'staging', 'failed']
            });

  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: >
      failure() &&
      (github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging')
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b
        with:
          node-version-file: ".nvmrc"

      - name: Install Wrangler
        run: npm install -g wrangler@4.92.0

      - name: Rollback to previous version
        id: rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Attempting automated rollback..."
          if wrangler rollback --env staging \
            --message "Automated rollback due to staging deployment failure" --yes; then
            echo "✅ Automated rollback successful"
            echo "rollback_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Automated rollback failed"
            echo "rollback_status=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create rollback notification
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const sha = context.sha;
            const runId = context.runId;
            const rollbackStatus = `${{ steps.rollback.outputs.rollback_status }}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const title = rollbackStatus === 'success'
              ? `AUTOMATED ROLLBACK - Staging deployment failed`
              : `ROLLBACK FAILED - Staging deployment failed`;

            // Check for existing open rollback issue
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deployment,staging,rollback'
            });

            const duplicateExists = existingIssues.data.some(issue =>
              issue.title === title && issue.body.includes(sha.substring(0, 7))
            );

            if (duplicateExists) {
              console.log(`Rollback issue already exists for ${sha.substring(0, 7)}`);
              return;
            }

            const body = rollbackStatus === 'success'
              ? `Staging deployment failed for commit ${sha}. ` +
                `**Automated rollback to the previous version was successful.**\n\n` +
                `[View failed workflow run](${url}/actions/runs/${runId})`
              : `Staging deployment failed for commit ${sha}. ` +
                `**Automated rollback also failed.** Manual intervention is required.\n\n` +
                `[View failed workflow run](${url}/actions/runs/${runId})`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['deployment', 'staging', 'rollback']
            });
        continue-on-error: true

      - name: Notify via Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROLLBACK_STATUS: ${{ steps.rollback.outputs.rollback_status }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Telegram secrets not set, skipping notification"
            exit 0
          fi

          MESSAGE="⚠️ *Staging Deployment Failed*%0A%0A"
          MESSAGE="${MESSAGE}Commit: \`${GITHUB_SHA:0:7}\`%0A"

          if [ "${ROLLBACK_STATUS}" = "success" ]; then
            MESSAGE="${MESSAGE}✅ *Automated rollback successful*"
          else
            MESSAGE="${MESSAGE}❌ *Automated rollback FAILED*"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown"
        continue-on-error: true
