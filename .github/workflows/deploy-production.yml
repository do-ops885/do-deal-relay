---
name: Deploy - Production

"on":
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Confirm production deployment"
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      confirm_deploy:
        description: "Confirm production deployment"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  actions: write
  checks: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pre-deploy-checks:
    name: Pre-Deploy Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Full test suite
        run: npm run test:ci

      - name: Run quality gate
        run: ./scripts/quality_gate.sh

      - name: Verify staging is healthy
        if: github.ref == 'refs/heads/main'
        continue-on-error: false
        env:
          WORKER_HOST: ${{ vars.WORKER_HOST }}
        run: |
          # Skip the staging gate if WORKER_HOST is not configured for the production environment.
          # This makes the staging health check OPT-IN: ops teams that have set up a staging
          # worker get a real pre-deploy check; teams that haven't yet (e.g. early projects)
          # can still deploy to production. A clear warning is logged so the gap is visible.
          if [ -z "${WORKER_HOST}" ]; then
            echo "⚠️  WORKER_HOST is not set on the 'production' GitHub Environment."
            echo "    Skipping staging health check."
            echo "    To enable: Settings → Environments → production → Variables → WORKER_HOST"
            echo "    Docs: https://github.com/do-ops885/do-deal-relay/blob/main/plans/GOAP-ci-failures-2026-06-06.md"
            exit 0
          fi

          STAGING_HOST="$(bash scripts/worker-host.sh staging || true)"
          if [ -z "${STAGING_HOST}" ]; then
            echo "❌ Could not resolve staging host from WORKER_HOST=${WORKER_HOST}"
            exit 1
          fi

          STAGING_URL="https://${STAGING_HOST}/health"
          echo "Verifying staging environment is healthy at ${STAGING_URL}..."

          if ! curl -sf "${STAGING_URL}"; then
            echo "❌ Staging not healthy. Aborting production deployment."
            exit 1
          fi
          echo "✅ Staging environment is healthy"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    needs: pre-deploy-checks
    timeout-minutes: 15

    if: >
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.event.inputs.confirm_deploy == 'true' || github.event_name == 'push')

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Production
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify production deployment
        id: verify
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_HOST: ${{ vars.WORKER_HOST }}
        run: |
          PROD_HOST="$(bash scripts/worker-host.sh production)"

          if [ -z "${PROD_HOST}" ]; then
            echo "⚠️  Could not resolve production host, skipping deployment verification"
            exit 0
          fi

          echo "Waiting for deployment to propagate..."
          sleep 15

          # Health check
          HEALTH_URL="https://${PROD_HOST}/health"
          echo "Checking health at: ${HEALTH_URL}"

          for i in {1..5}; do
            if curl -sf "${HEALTH_URL}"; then
              echo "✅ Production health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 10
          done

          echo "❌ Production health check failed after 5 attempts"
          exit 1

      - name: Seed KV for fresh deployments
        id: seed-kv
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_HOST: ${{ vars.WORKER_HOST }}
        run: |
          PROD_HOST="$(bash scripts/worker-host.sh production)"

          if [ -z "${PROD_HOST}" ]; then
            echo "⚠️  Could not resolve production host, skipping KV seeding"
            exit 0
          fi

          PROD_URL="https://${PROD_HOST}"

          echo "Checking if KV needs seeding..."
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${PROD_URL}/health" || echo "000")

          if [ "${HEALTH_STATUS}" = "503" ]; then
            echo "Fresh deployment detected (health=503), seeding KV..."
            # Create empty snapshot to initialize KV
            curl -sf -X POST "${PROD_URL}/api/discover" || true
            # Wait for discovery to complete
            sleep 5
            echo "KV seeded successfully"
          else
            echo "KV already initialized (health=${HEALTH_STATUS})"
          fi

      - name: Seed E2E test API keys to production KV
        id: seed-e2e-keys
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "⚠️  CLOUDFLARE_API_TOKEN not set, skipping E2E KV seeding"
            exit 0
          fi

          DEALS_SOURCES_ID="be3c0fc148b749b49a59aa7cfa23e3ac"

          echo "Seeding E2E test API keys to production KV..."

          # Admin key (ddr_admin_test_key_0000000000000000)
          ADMIN_JSON='{"userId":"e2e-admin","role":"admin",'
          ADMIN_JSON+='"createdAt":"2025-01-01T00:00:00Z",'
          ADMIN_JSON+='"rateLimit":{"requestsPerMinute":100,"requestsPerHour":5000}}'
          npx wrangler kv key put --namespace-id "${DEALS_SOURCES_ID}" --remote \
            'apikey:36c3c6ac0ed11d5c316838ec88764dba53d2f790446970e30cc50d30afa79a3c' \
            "${ADMIN_JSON}"

          # User key (ddr_user_test_key_0000000000000000)
          USER_JSON='{"userId":"e2e-user","role":"user",'
          USER_JSON+='"createdAt":"2025-01-01T00:00:00Z",'
          USER_JSON+='"rateLimit":{"requestsPerMinute":60,"requestsPerHour":1000}}'
          npx wrangler kv key put --namespace-id "${DEALS_SOURCES_ID}" --remote \
            'apikey:6d06b29066b183fe10b2978d8e3ad5c2bac0f57740c7f1978fba0edec32dc414' \
            "${USER_JSON}"

          # Expired key (ddr_expired_test_key_0000000000000000)
          EXPIRED_JSON='{"userId":"e2e-expired","role":"user",'
          EXPIRED_JSON+='"createdAt":"2020-01-01T00:00:00Z",'
          EXPIRED_JSON+='"expiresAt":"2021-01-01T00:00:00Z",'
          EXPIRED_JSON+='"rateLimit":{"requestsPerMinute":1,"requestsPerHour":10}}'
          npx wrangler kv key put --namespace-id "${DEALS_SOURCES_ID}" --remote \
            'apikey:8440f560ecef5acc8a755f55176b2847008907591fab695d3d2e0fd0255502fe' \
            "${EXPIRED_JSON}"

          echo "✅ E2E test API keys seeded successfully"

      - name: Run smoke tests on production
        id: smoke-tests
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_HOST: ${{ vars.WORKER_HOST }}
        run: |
          PROD_HOST="$(bash scripts/worker-host.sh production)"

          if [ -z "${PROD_HOST}" ]; then
            echo "⚠️  Could not resolve production host, skipping smoke tests"
            exit 0
          fi

          PROD_URL="https://${PROD_HOST}"

          echo "Running smoke tests on production..."

          # Test health endpoint (may return 503 for fresh deployments)
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${PROD_URL}/health" || echo "000")
          # SC2170 fix: validate numeric before comparison or use string comparison
          if [ "${HEALTH_STATUS}" = "200" ] || [ "${HEALTH_STATUS}" = "503" ]; then
            echo "✅ Health endpoint OK (status: ${HEALTH_STATUS})"
          else
            echo "❌ Health endpoint failed with status ${HEALTH_STATUS}"
            exit 1
          fi

          # Test metrics endpoint
          curl -sf "${PROD_URL}/metrics" || exit 1
          echo "✅ Metrics endpoint OK"

          # Test deals endpoint (may return 404 for fresh deployments)
          DEALS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${PROD_URL}/deals" || echo "000")
          # SC2170 fix: use string comparison instead of -eq
          if [ "${DEALS_STATUS}" = "200" ] || [ "${DEALS_STATUS}" = "404" ]; then
            echo "✅ Deals endpoint OK (status: ${DEALS_STATUS})"
          else
            echo "❌ Deals endpoint failed with status ${DEALS_STATUS}"
            exit 1
          fi

          # Test API status endpoint
          curl -sf "${PROD_URL}/api/status" || exit 1
          echo "✅ API status endpoint OK"

          echo "All production smoke tests passed!"

      - name: Trigger initial discovery
        id: discovery
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_HOST: ${{ vars.WORKER_HOST }}
        run: |
          PROD_HOST="$(bash scripts/worker-host.sh production)"
          if [ -n "${PROD_HOST}" ]; then
            echo "Triggering discovery pipeline..."
            curl -sf -X POST \
              "https://${PROD_HOST}/api/discover" || true
          else
            echo "⚠️  Could not resolve production host, skipping discovery trigger"
          fi

      - name: Create deployment summary
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_HOST: ${{ vars.WORKER_HOST }}
        run: |
          PROD_HOST="$(bash scripts/worker-host.sh production || true)"
          REF_NAME="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          ACTOR="${{ github.actor }}"
          {
            echo "## Production Deployment Summary"
            echo ""
            echo "- **Version**: ${REF_NAME}"
            echo "- **Commit**: ${SHA}"
            echo "- **Deployed by**: @${ACTOR}"
            echo "- **Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo ""
            echo "### Endpoints"
            if [ -n "${PROD_HOST}" ]; then
              echo "- Health: https://${PROD_HOST}/health"
              echo "- Metrics: https://${PROD_HOST}/metrics"
              echo "- Deals: https://${PROD_HOST}/deals"
            else
              echo "- ⚠️  Could not resolve production host"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: `Production deployment for version ${tag}.\n\n` +
                'Deployed automatically via GitHub Actions.',
              draft: false,
              prerelease: false
            });

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const sha = context.sha;
            const runId = context.runId;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const title = `Production deployment failed - ${sha.substring(0, 7)}`;

            // Check for existing open issue with same title
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deployment,production,failed'
            });

            const duplicateExists = existingIssues.data.some(issue =>
              issue.title === title || issue.title.includes(sha.substring(0, 7))
            );

            if (duplicateExists) {
              console.log(`Issue already exists for deployment failure of ${sha.substring(0, 7)}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `Production deployment failed for commit ${sha}.\n\n` +
                `[View workflow run](${url}/actions/runs/${runId})`,
              labels: ['deployment', 'production', 'failed', 'urgent']
            });

  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy-production
    if: >
      failure() &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"

      - name: Install Wrangler
        run: npm install -g wrangler@4.79.0

      - name: Rollback to previous version
        id: rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_HOST: ${{ vars.WORKER_HOST }}
        run: |
          echo "Attempting automated rollback..."
          if wrangler rollback --env production \
            --message "Automated rollback due to deployment failure" --yes; then
            echo "✅ Automated rollback initiated successfully"

            # Wait for rollback to propagate
            sleep 15

            # Verify rollback health
            PROD_HOST="$(bash scripts/worker-host.sh production || true)"
            if [ -z "${PROD_HOST}" ]; then
              echo "⚠️  Could not resolve production host for rollback verification"
              exit 0
            fi
            HEALTH_URL="https://${PROD_HOST}/health"
            echo "Verifying rollback health at: ${HEALTH_URL}"

            for i in {1..5}; do
              if curl -sf "${HEALTH_URL}"; then
                echo "✅ Rollback health check passed"
                echo "rollback_status=success" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Attempt $i failed, retrying..."
              sleep 10
            done

            echo "❌ Rollback deployed but health check failed"
            echo "rollback_status=failure" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "❌ wrangler rollback failed"
            echo "Attempting rollback via Cloudflare API as fallback..."

            ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
            if [ -n "${ACCOUNT_ID}" ] && [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
              CF_API_BASE="https://api.cloudflare.com/client/v4"
              ROLLBACK_RESPONSE=$(curl -sf -X POST \
                "${CF_API_BASE}/accounts/${ACCOUNT_ID}/workers/scripts/do-deal-relay/deployments/rollback" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json")

              if echo "${ROLLBACK_RESPONSE}" | grep -q '"success":true'; then
                echo "✅ API rollback initiated successfully"
                echo "rollback_status=success" >> "$GITHUB_OUTPUT"
                exit 0
              else
                echo "❌ API rollback also failed"
                echo "rollback_status=failure" >> "$GITHUB_OUTPUT"
                echo "Manual rollback required via Cloudflare dashboard"
                exit 1
              fi
            fi

            echo "Cannot perform rollback - missing Cloudflare credentials"
            echo "rollback_status=failure" >> "$GITHUB_OUTPUT"
            echo "Please manually rollback via Cloudflare dashboard"
            exit 1
          fi

      - name: Create rollback notification
        if: steps.rollback.outcome == 'failure' || failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const sha = context.sha;
            const runId = context.runId;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const title = `ROLLBACK REQUIRED - Production deployment failed`;

            // Check for existing open rollback issue
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deployment,production,rollback'
            });

            const duplicateExists = existingIssues.data.some(issue =>
              issue.title === title && issue.body.includes(sha.substring(0, 7))
            );

            if (duplicateExists) {
              console.log(`Rollback issue already exists for ${sha.substring(0, 7)}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `Production deployment failed.\n\n` +
                `- Commit: ${sha}\n` +
                `- Failed run: [View workflow](${url}/actions/runs/${runId})\n\n` +
                '**Action Required**: Check Cloudflare dashboard and rollback.',
              labels: ['deployment', 'production', 'rollback', 'urgent']
            });
        continue-on-error: true
