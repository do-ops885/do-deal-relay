---
name: Auto Merge

"on":
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  pull-requests: write
  contents: write
  actions: read
  issues: write # required to close linked issues

concurrency:
  group: auto-merge-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  REQUIRE_BRANCH_UP_TO_DATE: true
  MERGE_METHOD: squash
  COMMIT_MESSAGE_FORMAT: "{title} (#{number})"

jobs:
  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub CLI
        run: gh auth status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR information
        id: get-pr
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          RUN_DATA=$(gh run view "$RUN_ID" --json headBranch,headSha)
          HEAD_BRANCH=$(echo "$RUN_DATA" | jq -r '.headBranch')
          HEAD_SHA=$(echo "$RUN_DATA" | jq -r '.headSha')

          echo "Head branch: ${HEAD_BRANCH}"
          echo "Head SHA: ${HEAD_SHA}"

          PR_FIELDS="number,title,headRefName,baseRefName,mergeStateStatus"
          PR_FIELDS="${PR_FIELDS},mergeable,reviewDecision,author,autoMergeRequest,headRefOid"
          PR_DATA=$(gh pr list --head "$HEAD_BRANCH" --json "$PR_FIELDS")
          PR_NUMBER=$(echo "$PR_DATA" | jq -r '.[0].number // empty')

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found for branch: ${HEAD_BRANCH}"
            exit 0
          fi

          {
            echo "pr_number=${PR_NUMBER}"
            echo "head_sha=${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Found PR #${PR_NUMBER}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify PR head matches workflow
        id: verify-head
        if: steps.get-pr.outputs.pr_number != ''
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"
          WORKFLOW_SHA="${{ steps.get-pr.outputs.head_sha }}"

          PR_HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')

          if [ "${WORKFLOW_SHA}" != "${PR_HEAD_SHA}" ]; then
            echo "❌ PR head SHA doesn't match workflow SHA"
            echo "PR SHA: ${PR_HEAD_SHA}, Workflow SHA: ${WORKFLOW_SHA}"
            echo "PR may have been updated since CI started — skipping"
            # Set flag so downstream steps can gate on this
            echo "sha_matched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "✅ PR head matches workflow SHA"
          echo "sha_matched=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check PR status
        id: check-status
        if: >
          steps.get-pr.outputs.pr_number != '' &&
          steps.verify-head.outputs.sha_matched == 'true'
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"

          FIELDS="number,title,headRefName,baseRefName,mergeStateStatus"
          FIELDS="${FIELDS},mergeable,reviewDecision,author,autoMergeRequest"
          PR_DATA=$(gh pr view "$PR_NUMBER" --json "$FIELDS")

          MERGE_STATE=$(echo "$PR_DATA" | jq -r '.mergeStateStatus')
          MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable')
          REVIEW_DECISION=$(echo "$PR_DATA" | jq -r '.reviewDecision')
          AUTHOR=$(echo "$PR_DATA" | jq -r '.author.login')
          BASE_REF=$(echo "$PR_DATA" | jq -r '.baseRefName')

          echo "PR #${PR_NUMBER} Status:"
          echo "  - Base Branch:     ${BASE_REF}"
          echo "  - Merge State:     ${MERGE_STATE}"
          echo "  - Mergeable:       ${MERGEABLE}"
          echo "  - Review Decision: ${REVIEW_DECISION}"
          echo "  - Author:          ${AUTHOR}"

          # Only auto-merge to develop or main
          if [ "${BASE_REF}" != "main" ] && [ "${BASE_REF}" != "develop" ]; then
            echo "Skipping: PR targets ${BASE_REF}, not main or develop"
            exit 0
          fi

          # Enforce REQUIRE_BRANCH_UP_TO_DATE: reject BEHIND branches
          if [ "${REQUIRE_BRANCH_UP_TO_DATE}" = "true" ] && [ "${MERGE_STATE}" = "BEHIND" ]; then
            echo "❌ Branch is behind base — skipping (REQUIRE_BRANCH_UP_TO_DATE=true)"
            exit 0
          fi

          # Reject blocked or conflicting states
          if [ "${MERGE_STATE}" = "BLOCKED" ] || [ "${MERGE_STATE}" = "DIRTY" ]; then
            echo "❌ PR merge state is ${MERGE_STATE} — skipping"
            exit 0
          fi

          # Check for merge conflicts
          if [ "${MERGEABLE}" != "MERGEABLE" ]; then
            echo "❌ PR is not mergeable (state: ${MERGEABLE})"
            exit 0
          fi

          # Reject if changes were explicitly requested
          if [ "${REVIEW_DECISION}" = "CHANGES_REQUESTED" ]; then
            echo "❌ Changes requested — skipping auto-merge"
            exit 0
          fi

          echo "✅ PR is ready for auto-merge"
          {
            echo "mergeable=true"
            echo "author=${AUTHOR}"
            echo "base_ref=${BASE_REF}"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check author permissions
        id: check-permissions
        if: >
          steps.get-pr.outputs.pr_number != '' &&
          steps.check-status.outputs.mergeable == 'true'
        run: |
          AUTHOR="${{ steps.check-status.outputs.author }}"
          REPO="${{ github.repository }}"
          echo "REPO=${REPO}"

          API_PATH="repos/$REPO/collaborators/$AUTHOR/permission"
          PERMISSION=$(gh api "$API_PATH" --jq '.permission' 2>/dev/null || echo "none")

          echo "Author ${AUTHOR} has permission: ${PERMISSION}"

          if [ "${PERMISSION}" != "admin" ] && \
             [ "${PERMISSION}" != "write" ] && \
             [ "${PERMISSION}" != "maintain" ]; then
            echo "❌ Author ${AUTHOR} lacks write access (permission: ${PERMISSION})"
            echo "Skipping auto-merge for external contributor"
            exit 0
          fi

          echo "✅ Author has sufficient permissions"
          echo "has_write_access=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve PR
        if: >
          steps.get-pr.outputs.pr_number != '' &&
          steps.check-permissions.outputs.has_write_access == 'true'
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"
          BOT_LOGIN="github-actions[bot]"

          REVIEWS=$(gh pr view "$PR_NUMBER" --json reviews --jq '.reviews')
          APPROVED_BY_BOT=$(echo "$REVIEWS" | \
            jq --arg login "$BOT_LOGIN" \
            'map(select(.author.login == $login and .state == "APPROVED")) | length')

          if [ "${APPROVED_BY_BOT}" -gt 0 ]; then
            echo "PR already approved by bot, skipping"
          else
            echo "Approving PR #${PR_NUMBER}"
            gh pr review "${PR_NUMBER}" --approve \
              --body "Auto-approved: CI passed and author has write access"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        id: enable-merge
        if: >
          steps.get-pr.outputs.pr_number != '' &&
          steps.check-permissions.outputs.has_write_access == 'true'
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"

          # Single API call for both title and auto-merge state
          PR_DATA=$(gh pr view "$PR_NUMBER" --json title,autoMergeRequest)
          PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')
          AUTO_MERGE_ENABLED=$(echo "$PR_DATA" | jq '.autoMergeRequest != null')

          if [ "${AUTO_MERGE_ENABLED}" = "true" ]; then
            echo "Auto-merge already enabled for PR #${PR_NUMBER}"
            exit 0
          fi

          # Format commit message — use awk to safely handle special characters in title
          COMMIT_MESSAGE=$(echo "${COMMIT_MESSAGE_FORMAT}" | \
            awk -v title="${PR_TITLE}" -v number="${PR_NUMBER}" \
            '{gsub(/{title}/, title); gsub(/{number}/, number); print}')

          # Use MERGE_METHOD env var (not hardcoded)
          MERGE_FLAG="--${MERGE_METHOD}"

          echo "Enabling auto-merge for PR #${PR_NUMBER} (method: ${MERGE_METHOD})"

          gh pr merge "${PR_NUMBER}" \
            ${MERGE_FLAG} \
            --auto \
            --subject "${COMMIT_MESSAGE}"

          echo "✅ Auto-merge enabled"
          echo "merge_enabled=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close linked issues
        if: >
          steps.get-pr.outputs.pr_number != '' &&
          steps.enable-merge.outputs.merge_enabled == 'true'
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"
          REPO="${{ github.repository }}"
          echo "REPO=${REPO}"

          # Extract issue numbers from PR body (handles "Closes #N", "Fixes #N", "Resolves #N")
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')
          ISSUE_NUMBERS=$(echo "$PR_BODY" | \
            grep -oiE '(closes|fixes|resolves)[[:space:]]+#([0-9]+)' | \
            grep -oE '[0-9]+' || true)

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No linked issues found in PR body — nothing to close"
            exit 0
          fi

          for ISSUE_NUMBER in $ISSUE_NUMBERS; do
            # Verify issue exists and is open before closing
            ISSUE_STATE=$(gh issue view "$ISSUE_NUMBER" --json state --jq '.state' 2>/dev/null || echo "NOT_FOUND")

            if [ "${ISSUE_STATE}" = "NOT_FOUND" ]; then
              echo "⚠️  Issue #${ISSUE_NUMBER} not found, skipping"
              continue
            fi

            if [ "${ISSUE_STATE}" != "OPEN" ]; then
              echo "Issue #${ISSUE_NUMBER} is already ${ISSUE_STATE}, skipping"
              continue
            fi

            echo "Closing issue #${ISSUE_NUMBER}"
            gh issue close "$ISSUE_NUMBER" \
              --comment "Closed automatically: linked PR #${PR_NUMBER} was merged via auto-merge."
            echo "✅ Closed issue #${ISSUE_NUMBER}"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report success
        if: >
          success() &&
          steps.get-pr.outputs.pr_number != '' &&
          steps.check-permissions.outputs.has_write_access == 'true'
        run: |
          echo "::notice::Auto-merge enabled for PR #${{ steps.get-pr.outputs.pr_number }}"

      - name: Report failure
        if: failure() && steps.get-pr.outputs.pr_number != ''
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"
          echo "::error::Auto-merge failed for PR #${PR_NUMBER}"

          LOGS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh pr comment "${PR_NUMBER}" \
            --body "⚠️ Auto-merge failed. Check [workflow logs](${LOGS_URL}) for details."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
