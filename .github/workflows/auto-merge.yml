---
name: Auto Merge

"on":
  check_suite:
    types: [completed]

permissions:
  pull-requests: write
  contents: write
  checks: read
  issues: write # required to close linked issues

# Serialize runs for the same commit. Multiple check suites on a single
# commit completing at roughly the same time will queue here; the first
# run that reaches the merge step wins, all subsequent ones exit early
# at step 1 (PR is already merged / no longer open).
concurrency:
  group: auto-merge-${{ github.event.check_suite.head_sha }}
  cancel-in-progress: false

env:
  REQUIRE_BRANCH_UP_TO_DATE: true
  MERGE_METHOD: squash
  COMMIT_MESSAGE_FORMAT: "{title} (#{number})"

jobs:
  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    # Fast-exit if the suite that just completed is itself non-passing.
    # At least one check is already broken — no need to query the rest.
    if: >
      contains(
        fromJSON('["success","neutral","skipped"]'),
        github.event.check_suite.conclusion
      )
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub CLI
        run: gh auth status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 1: Resolve the PR for this check suite ───────────────────────
      # Head SHA and branch come directly from the event payload — no extra
      # API call needed. PR number is taken from the event's pull_requests
      # array when present; falls back to a SHA-based search so fork PRs
      # (where head_branch can be ambiguous) are handled correctly.
      - name: Get PR information
        id: get-pr
        run: |
          HEAD_SHA="${{ github.event.check_suite.head_sha }}"
          HEAD_BRANCH="${{ github.event.check_suite.head_branch }}"
          REPO="${{ github.repository }}"

          echo "Head branch: ${HEAD_BRANCH}"
          echo "Head SHA:    ${HEAD_SHA}"

          # Fast path: PR number embedded in the event payload
          PR_NUMBER="${{ github.event.check_suite.pull_requests[0].number }}"

          # Slow path: search open PRs by head SHA (covers fork PRs and
          # cases where the event payload omits pull_requests)
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR in event payload — searching by SHA…"
            PR_NUMBER=$(gh api "repos/${REPO}/pulls" \
              --jq ".[] | select(.head.sha == \"${HEAD_SHA}\") | .number" \
              | head -1)
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for SHA ${HEAD_SHA} — skipping"
            exit 0
          fi

          {
            echo "pr_number=${PR_NUMBER}"
            echo "head_sha=${HEAD_SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Found PR #${PR_NUMBER}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: Confirm PR head still matches the event SHA ───────────────
      # Prevents acting on a stale suite when the branch received a new push
      # while checks were in flight.
      - name: Verify PR head matches event SHA
        id: verify-head
        if: steps.get-pr.outputs.pr_number != ''
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"
          EVENT_SHA="${{ steps.get-pr.outputs.head_sha }}"

          PR_HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')

          if [ "${EVENT_SHA}" != "${PR_HEAD_SHA}" ]; then
            echo "❌ SHA mismatch — branch was updated after checks started, skipping"
            echo "   Event SHA : ${EVENT_SHA}"
            echo "   PR head   : ${PR_HEAD_SHA}"
            echo "sha_matched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "✅ PR head matches event SHA (${EVENT_SHA})"
          echo "sha_matched=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 3: ALL checks on the commit must be completed + green ─────────
      # Queries every check run on the head SHA. Fires on every check suite
      # completion, so if any suite is still pending this step blocks the
      # merge until the next suite completes and re-triggers the job.
      #
      # Accepted conclusions: success, neutral, skipped
      # Blocking conclusions: failure, cancelled, timed_out, action_required, stale
      # TOTAL == 0 after filtering is treated as an unsafe state and aborts.
      - name: Verify all checks pass on head SHA
        id: verify-checks
        if: >
          steps.get-pr.outputs.pr_number != '' &&
          steps.verify-head.outputs.sha_matched == 'true'
        run: |
          REPO="${{ github.repository }}"
          HEAD_SHA="${{ steps.get-pr.outputs.head_sha }}"
          CURRENT_RUN="${{ github.run_id }}"

          echo "Fetching all check runs for SHA: ${HEAD_SHA}"

          ALL_CHECKS=$(gh api \
            "repos/${REPO}/commits/${HEAD_SHA}/check-runs" \
            --paginate \
            --jq '.check_runs[]')

          if [ -z "$ALL_CHECKS" ]; then
            echo "⚠️  No check runs found for ${HEAD_SHA} — cannot verify, skipping"
            exit 0
          fi

          # Exclude this auto-merge run so it never blocks itself
          FILTERED=$(echo "$ALL_CHECKS" | jq --arg run "$CURRENT_RUN" \
            'select(.details_url | test($run) | not)')

          TOTAL=$(echo "$FILTERED" | jq -s 'length')

          # Safety: if filtering removed everything we cannot make a safe
          # decision — abort rather than merge blindly
          if [ "${TOTAL}" -eq 0 ]; then
            echo "⚠️  All check runs were filtered out (total=0) — cannot verify safely, skipping"
            exit 0
          fi

          # Checks that have not finished yet
          PENDING=$(echo "$FILTERED" | \
            jq -r 'select(.status != "completed") | "  • \(.name) [\(.status)]"')

          # Checks that finished with a blocking conclusion
          BLOCKING='["failure","cancelled","timed_out","action_required","stale"]'
          FAILED=$(echo "$FILTERED" | \
            jq -r --argjson bad "$BLOCKING" \
            'select(.status == "completed" and ([.conclusion] | inside($bad))) |
             "  • \(.name) [\(.conclusion)]"')

          if [ -n "$PENDING" ]; then
            echo "❌ One or more checks are still in progress — will not merge:"
            echo "$PENDING"
            echo "all_checks_passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$FAILED" ]; then
            echo "❌ One or more checks failed — will not merge:"
            echo "$FAILED"
            echo "all_checks_passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "✅ All ${TOTAL} check(s) passed on ${HEAD_SHA}"
          echo "all_checks_passed=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 4: Validate PR eligibility ───────────────────────────────────
      # Checks structural blockers (conflicts, branch staleness, change
      # requests). Does NOT require CLEAN merge state here — that is
      # re-verified in the merge step after the bot approval is posted.
      - name: Check PR eligibility
        id: check-status
        if: >
          steps.get-pr.outputs.pr_number != '' &&
          steps.verify-checks.outputs.all_checks_passed == 'true'
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"

          FIELDS="number,title,headRefName,baseRefName,mergeStateStatus,mergeable,reviewDecision,author"
          PR_DATA=$(gh pr view "$PR_NUMBER" --json "$FIELDS")

          MERGE_STATE=$(echo "$PR_DATA" | jq -r '.mergeStateStatus')
          MERGEABLE=$(echo "$PR_DATA" | jq -r '.mergeable')
          REVIEW_DECISION=$(echo "$PR_DATA" | jq -r '.reviewDecision')
          AUTHOR=$(echo "$PR_DATA" | jq -r '.author.login')
          BASE_REF=$(echo "$PR_DATA" | jq -r '.baseRefName')
          PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')

          echo "PR #${PR_NUMBER} status:"
          echo "  Base branch    : ${BASE_REF}"
          echo "  Merge state    : ${MERGE_STATE}"
          echo "  Mergeable      : ${MERGEABLE}"
          echo "  Review decision: ${REVIEW_DECISION}"
          echo "  Author         : ${AUTHOR}"

          # Only auto-merge into main or develop
          if [ "${BASE_REF}" != "main" ] && [ "${BASE_REF}" != "develop" ]; then
            echo "Skipping: PR targets '${BASE_REF}', not main or develop"
            exit 0
          fi

          # Branch must be up to date when required
          if [ "${REQUIRE_BRANCH_UP_TO_DATE}" = "true" ] && [ "${MERGE_STATE}" = "BEHIND" ]; then
            echo "❌ Branch is behind '${BASE_REF}' — skipping (REQUIRE_BRANCH_UP_TO_DATE=true)"
            exit 0
          fi

          # Hard blockers: merge conflicts
          if [ "${MERGE_STATE}" = "DIRTY" ]; then
            echo "❌ PR has merge conflicts — skipping"
            exit 0
          fi

          if [ "${MERGEABLE}" != "MERGEABLE" ]; then
            echo "❌ PR is not mergeable (state: ${MERGEABLE})"
            exit 0
          fi

          if [ "${REVIEW_DECISION}" = "CHANGES_REQUESTED" ]; then
            echo "❌ Changes requested — skipping"
            exit 0
          fi

          echo "✅ PR is eligible for merge"
          {
            echo "eligible=true"
            echo "author=${AUTHOR}"
            echo "base_ref=${BASE_REF}"
            echo "pr_title=${PR_TITLE}"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 5: Author must have write access ─────────────────────────────
      - name: Check author permissions
        id: check-permissions
        if: >
          steps.get-pr.outputs.pr_number != '' &&
          steps.check-status.outputs.eligible == 'true'
        run: |
          AUTHOR="${{ steps.check-status.outputs.author }}"
          REPO="${{ github.repository }}"

          # Improved permission check with jq default and null handling.
          # jq's // operator returns "none" when .permission is null/absent.
          PERMISSION=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" \
            --jq '.permission // "none"' 2>/dev/null || echo "none")

          # Handle empty or null results from the API
          if [ -z "$PERMISSION" ] || [ "$PERMISSION" = "null" ]; then
            PERMISSION="none"
          fi

          echo "Author '${AUTHOR}' permission level: ${PERMISSION}"

          if [ "${PERMISSION}" != "admin" ] && \
             [ "${PERMISSION}" != "write" ] && \
             [ "${PERMISSION}" != "maintain" ]; then
            echo "❌ Author lacks write access (${PERMISSION}) — skipping for external contributor"
            echo "has_write_access=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "✅ Author has sufficient permissions"
          echo "has_write_access=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 6: Approve (idempotent) ─────────────────────────────────────
      - name: Approve PR
        if: >
          steps.get-pr.outputs.pr_number != '' &&
          steps.check-permissions.outputs.has_write_access == 'true'
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"
          BOT_LOGIN="github-actions[bot]"

          # shellcheck disable=SC2016
          JQ_FILTER='[.reviews[] | select(.author.login == $login and .state == "APPROVED")] | length'
          ALREADY_APPROVED=$(gh pr view "$PR_NUMBER" --json reviews \
            --jq "$JQ_FILTER" --arg login "$BOT_LOGIN")

          if [ "${ALREADY_APPROVED}" -gt 0 ]; then
            echo "PR #${PR_NUMBER} already approved by bot — skipping"
          else
            echo "Approving PR #${PR_NUMBER}"
            gh pr review "${PR_NUMBER}" --approve \
              --body "Auto-approved: all checks passed and author has write access."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 7: Final verification + direct merge ─────────────────────────
      # Owns the actual merge decision. Re-runs SHA guard, full check-run
      # verification, and merge state check immediately before the merge API
      # call — closing the window between step 3 and now.
      #
      # --auto is intentionally absent. GitHub's native auto-merge delegates
      # the merge decision to branch protection rules, which may not require
      # every workflow. Merging directly here guarantees no merge ever happens
      # when any check is failing or pending.
      - name: Verify checks and merge
        id: merge
        if: >
          steps.get-pr.outputs.pr_number != '' &&
          steps.check-permissions.outputs.has_write_access == 'true'
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"
          EVENT_SHA="${{ steps.get-pr.outputs.head_sha }}"
          REPO="${{ github.repository }}"
          CURRENT_RUN="${{ github.run_id }}"

          # ── Guard 1: Re-verify SHA hasn't moved since step 2 ──────────────
          CURRENT_HEAD=$(gh pr view "$PR_NUMBER" --json headRefOid --jq '.headRefOid')
          if [ "${EVENT_SHA}" != "${CURRENT_HEAD}" ]; then
            echo "❌ PR head moved between verification and merge — aborting"
            echo "   Expected : ${EVENT_SHA}"
            echo "   Current  : ${CURRENT_HEAD}"
            exit 0
          fi
          echo "✅ SHA confirmed: ${EVENT_SHA}"

          # ── Guard 2: Re-verify ALL checks are still green ─────────────────
          # Catches any check that began failing between step 3 and now.
          echo "Re-verifying check runs before merge…"

          ALL_CHECKS=$(gh api \
            "repos/${REPO}/commits/${EVENT_SHA}/check-runs" \
            --paginate \
            --jq '.check_runs[]')

          FILTERED=$(echo "$ALL_CHECKS" | jq --arg run "$CURRENT_RUN" \
            'select(.details_url | test($run) | not)')

          TOTAL=$(echo "$FILTERED" | jq -s 'length')

          if [ "${TOTAL}" -eq 0 ]; then
            echo "⚠️  All check runs were filtered out (total=0) — cannot verify safely, aborting"
            exit 0
          fi

          PENDING=$(echo "$FILTERED" | \
            jq -r 'select(.status != "completed") | "  • \(.name) [\(.status)]"')

          BLOCKING='["failure","cancelled","timed_out","action_required","stale"]'
          FAILED=$(echo "$FILTERED" | \
            jq -r --argjson bad "$BLOCKING" \
            'select(.status == "completed" and ([.conclusion] | inside($bad))) |
             "  • \(.name) [\(.conclusion)]"')

          if [ -n "$PENDING" ]; then
            echo "❌ Check(s) still running at merge time — aborting:"
            echo "$PENDING"
            exit 0
          fi

          if [ -n "$FAILED" ]; then
            echo "❌ Check(s) failed at merge time — aborting:"
            echo "$FAILED"
            exit 0
          fi

          echo "✅ All ${TOTAL} check(s) still green"

          # ── Guard 3: Merge state must be CLEAN after bot approval ─────────
          MERGE_STATE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus \
            --jq '.mergeStateStatus')

          if [ "${MERGE_STATE}" != "CLEAN" ] && [ "${MERGE_STATE}" != "HAS_HOOKS" ]; then
            echo "❌ Merge state is '${MERGE_STATE}' after approval — aborting"
            exit 0
          fi

          echo "✅ Merge state: ${MERGE_STATE}"

          # ── Merge ─────────────────────────────────────────────────────────
          PR_TITLE="${{ steps.check-status.outputs.pr_title }}"
          COMMIT_MESSAGE=$(echo "${COMMIT_MESSAGE_FORMAT}" | \
            awk -v title="${PR_TITLE}" -v number="${PR_NUMBER}" \
            '{gsub(/{title}/, title); gsub(/{number}/, number); print}')

          echo "Merging PR #${PR_NUMBER} (method: ${MERGE_METHOD})"
          gh pr merge "${PR_NUMBER}" \
            --"${MERGE_METHOD}" \
            --subject "${COMMIT_MESSAGE}"

          echo "✅ PR #${PR_NUMBER} merged"
          echo "merged=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 8: Close linked issues ───────────────────────────────────────
      - name: Close linked issues
        if: >
          steps.get-pr.outputs.pr_number != '' &&
          steps.merge.outputs.merged == 'true'
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"

          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""')
          ISSUE_NUMBERS=$(echo "$PR_BODY" | \
            grep -oiE '(closes|fixes|resolves)[[:space:]]+#([0-9]+)' | \
            grep -oE '[0-9]+' || true)

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No linked issues found in PR body"
            exit 0
          fi

          for ISSUE_NUMBER in $ISSUE_NUMBERS; do
            ISSUE_STATE=$(gh issue view "$ISSUE_NUMBER" \
              --json state --jq '.state' 2>/dev/null || echo "NOT_FOUND")

            if [ "${ISSUE_STATE}" = "NOT_FOUND" ]; then
              echo "⚠️  Issue #${ISSUE_NUMBER} not found — skipping"
              continue
            fi

            if [ "${ISSUE_STATE}" != "OPEN" ]; then
              echo "Issue #${ISSUE_NUMBER} is already ${ISSUE_STATE} — skipping"
              continue
            fi

            echo "Closing issue #${ISSUE_NUMBER}"
            gh issue close "$ISSUE_NUMBER" \
              --comment "Closed automatically: linked PR #${PR_NUMBER} was merged."
            echo "✅ Closed issue #${ISSUE_NUMBER}"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Reporting ─────────────────────────────────────────────────────────
      - name: Report success
        if: >
          success() &&
          steps.get-pr.outputs.pr_number != '' &&
          steps.merge.outputs.merged == 'true'
        run: |
          echo "::notice::PR #${{ steps.get-pr.outputs.pr_number }} merged successfully"

      - name: Report failure
        if: failure() && steps.get-pr.outputs.pr_number != ''
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"
          echo "::error::Auto-merge failed for PR #${PR_NUMBER}"
          LOGS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh pr comment "${PR_NUMBER}" \
            --body "⚠️ Auto-merge failed. Check [workflow logs](${LOGS_URL}) for details."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
