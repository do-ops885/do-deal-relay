name: Auto-merge Dependabot PRs

"on":
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Gate on the pull request author, not on github.actor. github.actor is
    # whoever triggered the run, so any branch update by a human or another
    # bot would skip the job and leave auto-merge unarmed.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update pull request branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Required by the strict up-to-date status check policy on main:
          # auto-merge waits for requirements, it does not update the branch.
          gh pr update-branch "${PR_NUMBER}" || echo "Branch update skipped (already up to date or not permitted)."

      - name: Enable auto-merge for Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh pr merge "${PR_NUMBER}" \
            --auto \
            --squash \
            --subject "${PR_TITLE}"
