---
name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.4)"
        required: true
        type: string
      create_tag:
        description: "Create git tag for this version"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  actions: write
  checks: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Verify VERSION file matches
        run: |
          FILE_VERSION=$(cat VERSION)
          TAG_VERSION="${{ steps.get-version.outputs.version }}"

          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "VERSION file ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "VERSION file matches tag"

      - name: Verify package.json matches
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${{ steps.get-version.outputs.version }}"

          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "package.json matches tag"

  create-tag:
    name: Create Git Tag
    runs-on: ubuntu-latest
    needs: validate-version
    if: github.event_name == 'workflow_dispatch' && inputs.create_tag == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push tag
        run: |
          TAG="v${{ needs.validate-version.outputs.version }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag $TAG"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate-version
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release body
        run: |
          chmod +x scripts/generate-release-body.sh
          TAG="v${{ needs.validate-version.outputs.version }}"
          bash scripts/generate-release-body.sh "$TAG" "${{ github.repository }}" > release-body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.validate-version.outputs.version }}"
          VERSION="${{ needs.validate-version.outputs.version }}"

          # Check if release already exists
          EXISTING=$(gh release view "$TAG" --json id --jq '.id' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Release $TAG already exists, updating..."
            gh release edit "$TAG" \
              --title "Release $TAG" \
              --notes-file release-body.md \
              --prerelease=false
            echo "Updated release $TAG"
          else
            IS_PRERELEASE="false"
            if echo "$VERSION" | grep -q '-'; then
              IS_PRERELEASE="true"
            fi
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes-file release-body.md \
              --generate-notes=false \
              --prerelease="$IS_PRERELEASE" \
              --latest
            echo "Created release $TAG"
          fi

  run-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: validate-version
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline benchmark
        id: benchmark
        continue-on-error: true
        run: |
          npx tsx scripts/benchmark_pipeline.ts --threshold 5000 --json benchmark-report.json
          echo "THROUGHPUT=$(jq -r '.results[-1].deals_per_second' benchmark-report.json)" >> "$GITHUB_OUTPUT"
          echo "SUCCESS=$(jq -r '.success' benchmark-report.json)" >> "$GITHUB_OUTPUT"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-report-${{ github.ref_name }}
          path: benchmark-report.json
          retention-days: 90

      - name: Add benchmark to release summary
        if: always()
        run: |
          if [ -f benchmark-report.json ]; then
            THROUGHPUT=$(jq -r '.results[-1].deals_per_second' benchmark-report.json)
            SUCCESS=$(jq -r '.success' benchmark-report.json)
            TOP_BOTTLENECK=$(jq -r '.bottlenecks[0] // "none"' benchmark-report.json)
            {
              echo "## Performance Benchmark"
              echo ""
              if [ "$SUCCESS" = "true" ]; then
                echo "✅ **Throughput**: $THROUGHPUT deals/sec (above 5,000 threshold)"
              else
                echo "❌ **Throughput**: $THROUGHPUT deals/sec (below 5,000 threshold)"
              fi
              echo "- **Bottleneck**: ${TOP_BOTTLENECK:-none}"
              echo ""
              echo "### Scale Analysis"
              echo "| Deals | Deals/sec |"
              echo "|-------|-----------|"
              jq -r '.results[] | "| \(.deals) | \(.deals_per_second) |"' benchmark-report.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [validate-version, create-release, run-benchmark]
    timeout-minutes: 10
    outputs:
      status: ${{ steps.verify.outputs.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Deploy to staging for verification
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Wait for staging propagation
        run: sleep 15

      - name: Run full deployment verification
        id: verify
        run: |
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

          if [ -z "${ACCOUNT_ID}" ]; then
            echo "⚠️  CLOUDFLARE_ACCOUNT_ID not set, skipping verification"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          chmod +x scripts/verify-deployment.sh
          if bash scripts/verify-deployment.sh "${ACCOUNT_ID}" staging; then
            echo "✅ Staging verification passed — proceeding to production"
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Staging verification failed — aborting production deploy"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Add verification to release summary
        if: always()
        run: |
          STATUS="${{ steps.verify.outputs.status }}"
          {
            echo "## Deployment Verification"
            echo ""
            case "${STATUS}" in
              passed)  echo "✅ All 8 endpoints verified on staging" ;;
              skipped) echo "⚠️  Verification skipped (no CLOUDFLARE_ACCOUNT_ID)" ;;
              failed)  echo "❌ Staging verification failed" ;;
              *)       echo "⚠️  Unknown status: ${STATUS}" ;;
            esac
            echo ""
            echo "### Endpoints Tested"
            echo "- GET /health"
            echo "- GET /metrics"
            echo "- GET /deals"
            echo "- GET /deals.json"
            echo "- GET /api/status"
            echo "- GET /api/log"
            echo "- POST /api/discover"
            echo "- POST /api/submit"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy to Production
    needs: [validate-version, create-release, run-benchmark, verify-deployment]
    if: >
      needs.verify-deployment.outputs.status == 'passed' ||
      needs.verify-deployment.outputs.status == '' ||
      needs.verify-deployment.result == 'skipped'
    uses: ./.github/workflows/deploy-production.yml
    with:
      confirm_deploy: true
    secrets: inherit

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [validate-version, create-release, deploy-production]
    if: always()

    steps:
      - name: Notify success
        if: needs.deploy-production.result == 'success'
        run: |
          echo "::notice::Release v${{ needs.validate-version.outputs.version }} deployed successfully"

      - name: Notify failure
        if: needs.deploy-production.result == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const version = '${{ needs.validate-version.outputs.version }}';
            const tag = `v${version}`;
            const sha = context.sha;
            const runId = context.runId;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const title = `Release ${tag} deployment failed`;

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'release,failed'
            });

            const duplicateExists = existingIssues.data.some(issue =>
              issue.title === title || issue.title.includes(tag)
            );

            if (duplicateExists) {
              console.log(`Issue already exists for release failure of ${tag}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `Release ${tag} deployment failed.\n\n` +
                `- Version: ${version}\n` +
                `- Commit: ${sha}\n` +
                `- Release: ${url}/releases/tag/${tag}\n` +
                `- [View workflow run](${url}/actions/runs/${runId})\n\n` +
                '**Action Required**: Check deployment logs and retry.',
              labels: ['release', 'failed', 'urgent']
            });
