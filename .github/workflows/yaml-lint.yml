---
name: YAML Lint

"on":
  push:
    branches:
      - main
      - develop
    paths:
      - "**.yml"
      - "**.yaml"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**.yml"
      - "**.yaml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  yamllint:
    name: YAML Syntax Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce81c88
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint -d \
            "{extends: default, rules: {line-length: {max: 120}, indentation: {spaces: 2}}}" \
            .github/workflows/ || (echo "❌ YAML lint failed" && exit 1)

  actionlint:
    name: GitHub Actions Workflow Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run actionlint
        uses: reviewdog/action-actionlint@768239029146f8883e0797177579893d56d83765
        with:
          fail_level: error
          filter_mode: nofilter
