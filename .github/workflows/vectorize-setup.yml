---
name: Vectorize Index Setup

"on":
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to create Vectorize index for"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
          - both
      confirm:
        description: "Confirm you want to create the index (idempotent)"
        required: true
        type: boolean
        default: false

concurrency:
  group: vectorize-setup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup-production-vectorize:
    name: Setup Production Vectorize Index
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    if: >
      github.event.inputs.confirm == 'true' &&
      (github.event.inputs.environment == 'production' ||
       github.event.inputs.environment == 'both')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: ".nvmrc"

      - name: Install Wrangler
        run: npm install -g wrangler@4.79.0

      - name: Create Production Vectorize Index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Creating production Vectorize index: deal-embeddings"
          echo "Dimensions: 768 (matches @cf/baai/bge-base-en-v1.5)"
          echo "Metric: cosine"

          # Idempotent: ignore "already exists" errors
          wrangler vectorize create "deal-embeddings" \
            --dimensions=768 \
            --metric=cosine \
            --env production 2>&1 || {
            echo "Note: deal-embeddings may already exist or creation failed"
            echo "Verify with: wrangler vectorize list"
          }

          echo ""
          echo "✅ Production Vectorize index setup complete"

      - name: List Vectorize indexes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Current Vectorize indexes:"
          wrangler vectorize list 2>&1 || echo "Could not list indexes"

  setup-staging-vectorize:
    name: Setup Staging Vectorize Index
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10

    if: >
      github.event.inputs.confirm == 'true' &&
      (github.event.inputs.environment == 'staging' ||
       github.event.inputs.environment == 'both')

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: ".nvmrc"

      - name: Install Wrangler
        run: npm install -g wrangler@4.79.0

      - name: Create Staging Vectorize Index
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Creating staging Vectorize index: deal-embeddings-staging"
          echo "Dimensions: 768 (matches @cf/baai/bge-base-en-v1.5)"
          echo "Metric: cosine"

          # Idempotent: ignore "already exists" errors
          wrangler vectorize create "deal-embeddings-staging" \
            --dimensions=768 \
            --metric=cosine \
            --env staging 2>&1 || {
            echo "Note: deal-embeddings-staging may already exist or creation failed"
            echo "Verify with: wrangler vectorize list"
          }

          echo ""
          echo "✅ Staging Vectorize index setup complete"

      - name: List Vectorize indexes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Current Vectorize indexes:"
          wrangler vectorize list 2>&1 || echo "Could not list indexes"
