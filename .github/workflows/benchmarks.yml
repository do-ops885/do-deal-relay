---
name: Performance Benchmarks

"on":
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run Pipeline Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm ci
      - name: Run Benchmark
        run: |
          npx tsx scripts/benchmark_pipeline.ts --json benchmark-report.json --threshold 5000
      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: benchmark-report
          path: benchmark-report.json
          retention-days: 30
      - name: Generate Summary
        if: always()
        run: |
          if [ -f benchmark-report.json ]; then
            THROUGHPUT=$(jq -r '.results[-1].deals_per_second' benchmark-report.json)
            THRESHOLD=$(jq -r '.threshold_deals_per_sec' benchmark-report.json)
            SUCCESS=$(jq -r '.success' benchmark-report.json)
            RUN_ID=$(jq -r '.run_id' benchmark-report.json)

            {
              echo "## Performance Benchmark Results"
              echo "| Metric | Value |"
              echo "|--------|-------|"
              echo "| Run ID | $RUN_ID |"
              echo "| Throughput | $THROUGHPUT deals/sec |"
              echo "| Threshold | $THRESHOLD deals/sec |"
              echo "| Status | $([ "$SUCCESS" = "true" ] && echo "✅ PASS" || echo "❌ FAIL") |"
              echo "### Phase Timings (1000 deals)"
              echo "| Phase | Duration (ms) |"
              echo "|-------|---------------|"
              jq -r \
                '.phase_timings | to_entries[] | "| \(.key) | \(.value) |"' \
                benchmark-report.json
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Performance Benchmark Failed"
              echo "Benchmark report not found."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
